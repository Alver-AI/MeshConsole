name: Release

# A new VERSION in mesh_console.py on main becomes tag vX.Y.Z and a GitHub
# release with that version's section of CHANGELOG.md as the notes.
# Versions that already have a release are skipped.

on:
  push:
    branches: [main]
    paths: [mesh_console.py, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(sed -nE 's/^VERSION *= *"([^"]+)".*/\1/p' mesh_console.py)
          if [ -z "$version" ]; then
            echo "::error file=mesh_console.py::VERSION not found"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # notes = lines between "## [VERSION]" and the next "## " heading
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## /                  { exit }
            on                            { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::No '## [$VERSION]' section in CHANGELOG.md"
            exit 1
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "Meshtastic Console $VERSION" --notes-file notes.md
